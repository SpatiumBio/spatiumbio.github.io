<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Spatium Biosystems — Programming biomolecular space.">
  <title>Spatium Biosystems</title>

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="Spatium_logo_2.png">

  <!-- Social preview (LinkedIn, Slack, X, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Spatium Biosystems">
  <meta property="og:description" content="Programming biomolecular space.">
  <meta property="og:url" content="https://spatiumbio.github.io/">
  <meta property="og:image" content="https://spatiumbio.github.io/Spatium_logo_2.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Spatium Biosystems">
  <meta name="twitter:description" content="Programming biomolecular space.">
  <meta name="twitter:image" content="https://spatiumbio.github.io/Spatium_logo_2.png">

  <style>
    :root {
      color-scheme: light;
      --background: #fbefe5;
      --text: #062f59;
      --accent: #ad7b25;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(100%, 1100px);
      padding: clamp(2rem, 6vw, 5rem) clamp(1.25rem, 5vw, 4rem);
      text-align: center;
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 640px;
      height: auto;
      margin: 0 auto;
    }

    .contact {
      margin: clamp(1.75rem, 4vw, 3rem) 0 0;
      font-size: clamp(1rem, 2vw, 1.2rem);
      letter-spacing: 0.04em;
    }

    .contact a {
      color: var(--text);
      text-decoration-color: var(--accent);
      text-decoration-thickness: 2px;
      text-underline-offset: 0.35em;
    }

    .contact a:hover,
    .contact a:focus-visible {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <img
      class="logo"
      src="Spatium_logo_2.png"
      alt="Spatium Biosystems — Programming biomolecular space"
      width="1672"
      height="941"
    >
    <p class="contact">
      Contact: <a href="mailto:contact@spatium.bio">contact@spatium.bio</a>
    </p>
  </main>
</body>
</html>
